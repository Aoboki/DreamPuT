<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Volkov Commander — Files</title>
<link rel="icon" type="image/png" href="/static/PIT.png">
<style>
* { box-sizing: border-box; }
html, body {
  margin: 0; height: 100%; overflow: hidden;
  background: #0000aa; color: #aaaaaa;
  font-family: Consolas, "Courier New", monospace; font-size: 15px;
}
.app { display: flex; flex-direction: column; height: 100vh; }
.topbar {
  display: flex; align-items: center; gap: 12px;
  padding: 4px 10px; background: #00aaaa; color: #000;
  font-weight: bold; border-bottom: 1px solid #000;
}
.topbar .title { flex: 1; }
.topbar .meta { font-weight: normal; font-size: 13px; }
.topbar a {
  color: #000; text-decoration: none; padding: 2px 8px;
  border: 1px solid #0000aa; background: #00aaaa;
}
.topbar a:hover { background: #ffff55; }
.panels {
  flex: 1; min-height: 0; display: flex; justify-content: center;
  gap: 6px; padding: 6px 8px; max-width: 1100px; width: 100%; margin: 0 auto;
}
.panel {
  display: flex; flex-direction: column; min-width: 0; min-height: 0;
  flex: 1 1 0; max-width: 520px;
  border: 1px solid #55ffff; background: #0000aa; color: #55ffff;
}
.panel.active { border-color: #ffff55; box-shadow: inset 0 0 0 1px #ffff55; }
.panel-head {
  text-align: center; padding: 2px 6px; height: 20px; line-height: 16px;
  background: #0000aa; color: #ffff55; border-bottom: 1px solid #55ffff;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  cursor: pointer; user-select: none; font-size: 13px;
}
.panel-head:hover { text-decoration: underline; }
.panel.active .panel-head { background: #00aaaa; color: #000; font-weight: bold; }
.cols {
  display: grid; grid-template-columns: minmax(0,1fr) 70px 120px;
  padding: 0 4px; color: #fff; border-bottom: 1px solid #55ffff; font-size: 12px;
}
.list { flex: 1; overflow: auto; outline: none; }
.row {
  display: grid; grid-template-columns: minmax(0,1fr) 70px 120px;
  padding: 0 4px; cursor: pointer; white-space: nowrap;
  height: 18px; line-height: 18px; max-height: 18px;
  align-items: center; overflow: hidden; font-size: 13px; font-weight: normal;
}
.row .n, .row .sz, .row .dt {
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  line-height: 18px; height: 18px;
}
.row.dir { color: #fff; }
.row.file { color: #55ffff; }
.row.sel { background: #00aaaa; color: #000 !important; }
.row.marked { color: #ffff55 !important; }
.row.marked.sel { background: #00aaaa; color: #ffff00 !important; }
.panel-foot {
  border-top: 1px solid #55ffff; padding: 2px 6px; color: #ffff55;
  font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.cmdline {
  display: flex; align-items: center; gap: 6px; padding: 3px 8px;
  background: #0000aa; color: #fff; border-top: 1px solid #55ffff;
}
.cmdline label { color: #ffff55; }
.cmdline input {
  flex: 1; background: #0000aa; border: none; color: #fff;
  font-family: inherit; font-size: 15px; outline: none;
}
.fnbar {
  display: grid; grid-template-columns: repeat(10, 1fr);
  background: #000; border-top: 1px solid #55ffff;
}
.fn {
  display: flex; flex-direction: column; border-right: 1px solid #0000aa;
  cursor: pointer; user-select: none;
}
.fn:last-child { border-right: none; }
.fn .k { background: #0000aa; color: #fff; text-align: center; font-size: 12px; padding: 1px 0; }
.fn .l {
  background: #00aaaa; color: #000; text-align: center; font-weight: bold;
  font-size: 12px; padding: 3px 2px; white-space: nowrap; overflow: hidden;
}
.fn:hover .l { background: #ffff55; }
.fn.danger .l { color: #aa0000; }
.status-line { background: #000; color: #aaa; padding: 2px 8px; font-size: 12px; }

/* Classic VC dialogs */
.modal {
  display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.55);
  align-items: center; justify-content: center; z-index: 50;
}
.modal.show { display: flex; }
.dlg {
  background: #00aaaa; color: #000; border: 2px solid #fff;
  min-width: 340px; max-width: 92vw; font-family: inherit;
}
.dlg h3 {
  margin: 0; padding: 6px 10px; background: #0000aa; color: #ffff55;
  font-size: 14px; text-align: center;
}
.dlg .body { padding: 12px 14px; white-space: pre-wrap; word-break: break-word; }
.dlg input {
  width: 100%; font-family: inherit; font-size: 14px;
  padding: 4px 6px; border: 2px solid #0000aa; margin-top: 8px;
}
.dlg .actions { display: flex; justify-content: flex-end; gap: 8px; padding: 8px 12px; }
.dlg button {
  font-family: inherit; font-weight: bold; padding: 4px 14px;
  border: 2px solid #0000aa; background: #00aaaa; cursor: pointer;
}
.dlg button:hover { background: #ffff55; }

/* Progress window like classic copy dialog */
.progress-dlg .body { min-width: 360px; }
.prog-file { margin-bottom: 8px; font-size: 13px; }
.prog-bar-outer {
  height: 18px; border: 2px solid #0000aa; background: #0000aa; margin: 8px 0;
}
.prog-bar-inner {
  height: 100%; width: 0%; background: #ffff55; transition: width 0.15s linear;
}
.prog-pct { text-align: center; font-weight: bold; font-size: 16px; }

@media (max-width: 700px) {
  .panels { flex-direction: column; max-width: 100%; }
  .panel { max-width: 100%; }
  .fnbar { grid-template-columns: repeat(5, 1fr); }
}
</style>
</head>
<body>
<div class="app">
  <div class="topbar">
    <span class="title">Volkov Commander</span>
    <span class="meta">Remote: <b id="hostLabel">—</b></span>
    <span class="meta">This PC (browser)</span>
    <a href="/">← Back</a>
  </div>

  <div class="panels">
    <div class="panel active" id="panel-L" data-side="L" tabindex="0">
      <div class="panel-head" id="head-L">C:\</div>
      <div class="cols"><span>Name</span><span>Size</span><span>Date</span></div>
      <div class="list" id="list-L"></div>
      <div class="panel-foot" id="foot-L"></div>
    </div>
    <div class="panel" id="panel-R" data-side="R" tabindex="0">
      <div class="panel-head" id="head-R">C:\</div>
      <div class="cols"><span>Name</span><span>Size</span><span>Date</span></div>
      <div class="list" id="list-R"></div>
      <div class="panel-foot" id="foot-R"></div>
    </div>
  </div>

  <div class="cmdline">
    <label id="cmdPrompt">C:\&gt;</label>
    <input id="cmdInput" type="text" autocomplete="off" spellcheck="false">
  </div>

  <div class="fnbar">
    <div class="fn" data-f="1"><div class="k">1</div><div class="l">Help</div></div>
    <div class="fn" data-f="2"><div class="k">2</div><div class="l">Info</div></div>
    <div class="fn" data-f="3"><div class="k">3</div><div class="l">View</div></div>
    <div class="fn" data-f="4"><div class="k">4</div><div class="l">Get↓</div></div>
    <div class="fn" data-f="5"><div class="k">5</div><div class="l">Copy</div></div>
    <div class="fn" data-f="6"><div class="k">6</div><div class="l">RenMov</div></div>
    <div class="fn" data-f="7"><div class="k">7</div><div class="l">MkDir</div></div>
    <div class="fn danger" data-f="8"><div class="k">8</div><div class="l">Delete</div></div>
    <div class="fn" data-f="9"><div class="k">9</div><div class="l">Put↑</div></div>
    <div class="fn" data-f="10"><div class="k">10</div><div class="l">Quit</div></div>
  </div>
  <div class="status-line" id="status">Ready</div>
</div>

<div class="modal" id="modal">
  <div class="dlg">
    <h3 id="dlgTitle">Dialog</h3>
    <div class="body">
      <div id="dlgText"></div>
      <input id="dlgInput" type="text">
    </div>
    <div class="actions">
      <button type="button" id="dlgOk">OK</button>
      <button type="button" id="dlgCancel">Cancel</button>
    </div>
  </div>
</div>

<div class="modal" id="progressModal">
  <div class="dlg progress-dlg">
    <h3 id="progTitle">Copy</h3>
    <div class="body">
      <div class="prog-file" id="progFile">file</div>
      <div class="prog-bar-outer"><div class="prog-bar-inner" id="progBar"></div></div>
      <div class="prog-pct" id="progPct">0%</div>
      <div id="progExtra" style="margin-top:6px;font-size:12px;"></div>
    </div>
  </div>
</div>

<input type="file" id="fileInput" style="display:none" multiple>

<script src="/static/js/files.js?v=5"></script>
</body>
</html>
