<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="icon" type="image/png" href="/static/PIT.png">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stats — Remote Desktop</title>
    <style>
        * { box-sizing: border-box; }
        body {
            margin: 0;
            font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;
            background: radial-gradient(circle at top left, #1e293b 0, #0f172a 42%, #020617 100%);
            color: #e5e7eb;
            min-height: 100vh;
            padding: 30px 20px;
        }
        .container { max-width: 960px; margin: 0 auto; }
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 24px;
            flex-wrap: wrap;
            gap: 12px;
        }
        h1 { margin: 0; font-size: 26px; color: #f8fafc; }
        .sub { color: #94a3b8; font-size: 14px; margin-top: 6px; }
        .actions { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
        a.btn, button.btn {
            border: 1px solid #334155;
            background: rgba(15, 23, 42, 0.75);
            color: #cbd5e1;
            padding: 10px 16px;
            border-radius: 10px;
            cursor: pointer;
            font-size: 14px;
            text-decoration: none;
            display: inline-block;
        }
        a.btn:hover, button.btn:hover {
            background: #1e293b;
            border-color: #475569;
            color: #fff;
        }
        a.btn.primary, button.btn.primary {
            background: #2563eb;
            border-color: #3b82f6;
            color: #fff;
        }
        .tabs { display: flex; gap: 8px; margin-bottom: 14px; flex-wrap: wrap; }
        .tab {
            border: 1px solid #334155;
            background: rgba(15, 23, 42, 0.6);
            color: #94a3b8;
            padding: 8px 14px;
            border-radius: 999px;
            cursor: pointer;
            font-size: 13px;
        }
        .tab.active {
            color: #fff;
            border-color: #3b82f6;
            background: rgba(37, 99, 235, 0.25);
        }
        .card {
            background: rgba(15, 23, 42, 0.82);
            border: 1px solid rgba(148, 163, 184, 0.15);
            border-radius: 16px;
            padding: 20px;
        }
        pre {
            margin: 0;
            white-space: pre-wrap;
            word-break: break-word;
            font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
            font-size: 13px;
            line-height: 1.55;
            color: #cbd5e1;
            max-height: 70vh;
            overflow: auto;
        }
        .meta {
            color: #94a3b8;
            font-size: 13px;
            margin-bottom: 12px;
        }
    </style>
</head>
<body>
<div class="container">
    <div class="header">
        <div>
            <h1 id="title">📊 DreamPUT Stats</h1>
            <div class="sub" id="subtitle">Source: https://aoboki.pp.ua</div>
        </div>
        <div class="actions">
            <a class="btn" href="/">← Dashboard</a>
            <a class="btn primary" id="btn-download" href="/api/stats/activity/download">Download .txt</a>
            <button class="btn" type="button" id="btn-refresh">Refresh</button>
        </div>
    </div>

    <div class="tabs">
        <button type="button" class="tab active" data-tab="activity">User activity</button>
        <button type="button" class="tab" data-tab="visits">Page visit IPs</button>
    </div>

    <div class="card">
        <div class="meta" id="meta">Loading…</div>
        <pre id="log">…</pre>
    </div>
</div>
<script>
(function () {
    const params = new URLSearchParams(location.search);
    let tab = params.get("tab") === "visits" ? "visits" : "activity";

    const title = document.getElementById("title");
    const subtitle = document.getElementById("subtitle");
    const download = document.getElementById("btn-download");
    const pre = document.getElementById("log");
    const meta = document.getElementById("meta");

    function setTabUI() {
        document.querySelectorAll(".tab").forEach(function (btn) {
            btn.classList.toggle("active", btn.getAttribute("data-tab") === tab);
        });
        if (tab === "visits") {
            title.textContent = "🌐 DreamPUT Page Visits";
            subtitle.textContent = "Source: https://aoboki.pp.ua · TIME | IP | Location | Path | UA";
            download.href = "/api/stats/page-visits/download";
        } else {
            title.textContent = "📊 DreamPUT User Activity";
            subtitle.textContent = "Source: https://aoboki.pp.ua · TIME | IP | Login | Event";
            download.href = "/api/stats/activity/download";
        }
        const url = new URL(location.href);
        if (tab === "visits") url.searchParams.set("tab", "visits");
        else url.searchParams.delete("tab");
        history.replaceState(null, "", url.pathname + url.search);
    }

    async function loadLog() {
        setTabUI();
        const endpoint = tab === "visits"
            ? "/api/stats/page-visits?t=" + Date.now()
            : "/api/stats/activity?t=" + Date.now();
        try {
            const r = await fetch(endpoint, {
                credentials: "same-origin",
                cache: "no-store",
            });
            if (r.status === 401) {
                location.href = "/login";
                return;
            }
            const text = await r.text();
            pre.textContent = text;
            const lines = text.split("\n").filter(function (l) {
                return l.trim() && !l.trim().startsWith("#");
            });
            const unique = {};
            lines.forEach(function (l) {
                if (l.indexOf("IP:") >= 0) {
                    try {
                        const ip = l.split("IP:")[1].split("|")[0].trim();
                        if (ip) unique[ip] = true;
                    } catch (e) {}
                }
            });
            meta.textContent =
                lines.length + " line(s) · unique IPs: " +
                Object.keys(unique).length +
                " · updated " + new Date().toLocaleString();
        } catch (e) {
            pre.textContent = "Failed to load: " + e;
            meta.textContent = "Error";
        }
    }

    document.querySelectorAll(".tab").forEach(function (btn) {
        btn.addEventListener("click", function () {
            tab = btn.getAttribute("data-tab") || "activity";
            loadLog();
        });
    });
    document.getElementById("btn-refresh").addEventListener("click", loadLog);
    loadLog();
})();
</script>
</body>
</html>
