<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Motion events — Remote Desktop</title>
  <link rel="icon" type="image/png" href="/static/PIT.png">
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;
      background: radial-gradient(circle at top left, #1e293b 0, #0f172a 42%, #020617 100%);
      color: #e5e7eb;
      min-height: 100vh;
      padding: 20px 16px 40px;
    }
    .wrap { max-width: 1200px; margin: 0 auto; }
    .top {
      display: flex; justify-content: space-between; align-items: center;
      gap: 12px; flex-wrap: wrap; margin-bottom: 18px;
    }
    h1 { margin: 0; font-size: 24px; }
    .sub { color: #94a3b8; font-size: 14px; margin-top: 4px; }
    a.btn, button.btn {
      border: 1px solid #334155;
      background: rgba(15, 23, 42, 0.85);
      color: #cbd5e1;
      padding: 9px 14px;
      border-radius: 10px;
      text-decoration: none;
      font-size: 14px;
      cursor: pointer;
      display: inline-block;
    }
    a.btn:hover, button.btn:hover { color: #fff; border-color: #475569; }
    .cols {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
      align-items: start;
    }
    /* Always two columns (left | right), including phones */
    .col {
      background: rgba(15, 23, 42, 0.9);
      border: 1px solid rgba(148, 163, 184, 0.18);
      border-radius: 14px;
      padding: 14px;
      min-width: 0; /* prevent grid blowout on narrow screens */
    }
    .col h2 {
      margin: 0 0 12px;
      font-size: 16px;
      position: sticky;
      top: 0;
      z-index: 2;
      background: rgba(15, 23, 42, 0.96);
      padding: 4px 0 8px;
    }
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
      gap: 10px;
    }
    @media (max-width: 800px) {
      body { padding: 12px 8px 28px; }
      h1 { font-size: 18px; }
      .sub { font-size: 12px; }
      .cols {
        grid-template-columns: 1fr 1fr;
        gap: 8px;
      }
      .col {
        padding: 8px;
        border-radius: 10px;
      }
      .col h2 { font-size: 13px; margin-bottom: 8px; position: static; }
      .grid {
        grid-template-columns: 1fr;
        gap: 8px;
      }
      .card .meta { font-size: 11px; padding: 6px; }
      a.btn, button.btn { padding: 7px 10px; font-size: 12px; }
    }
    .card {
      background: #0b1220;
      border: 1px solid #1e293b;
      border-radius: 12px;
      overflow: hidden;
      cursor: pointer;
      transition: border-color .15s;
    }
    .card:hover { border-color: #3b82f6; }
    .card img {
      width: 100%;
      aspect-ratio: 4/3;
      object-fit: cover;
      display: block;
      background: #000;
    }
    .card .ph {
      width: 100%;
      aspect-ratio: 4/3;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #64748b;
      font-size: 12px;
      background: #020617;
    }
    .card .meta {
      padding: 8px;
      font-size: 12px;
      color: #94a3b8;
    }
    .card .meta strong { color: #e2e8f0; display: block; margin-bottom: 2px; }
    .status { font-size: 13px; color: #94a3b8; }
    .status.ok { color: #4ade80; }
    .modal {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,.75);
      z-index: 50;
      align-items: center;
      justify-content: center;
      padding: 16px;
    }
    .modal.open { display: flex; }
    .modal-box {
      background: #0f172a;
      border: 1px solid #334155;
      border-radius: 14px;
      max-width: 900px;
      width: 100%;
      padding: 14px;
    }
    .modal-box video { width: 100%; max-height: 70vh; background: #000; border-radius: 8px; }
    .modal-head {
      display: flex; justify-content: space-between; align-items: center;
      margin-bottom: 10px; gap: 8px;
    }
    .empty { color: #64748b; font-size: 13px; padding: 12px 0; }
  </style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <div>
      <h1>📸 Motion events</h1>
      <div class="sub">Trigger photos (threshold from config, e.g. 25%) · click to play the linked clip</div>
    </div>
    <div style="display:flex;gap:8px;flex-wrap:wrap;align-items:center;">
      <span class="status" id="status">Loading…</span>
      <button type="button" class="btn" id="btn-refresh">Refresh</button>
      <a class="btn" href="/webcams">📷 Live</a>
      <a class="btn" href="/">← Dashboard</a>
    </div>
  </div>

  <div class="cols">
    <div class="col">
      <h2>Left (L…)</h2>
      <div class="grid" id="left"></div>
    </div>
    <div class="col">
      <h2>Right (R…)</h2>
      <div class="grid" id="right"></div>
    </div>
  </div>
</div>

<div class="modal" id="modal">
  <div class="modal-box">
    <div class="modal-head">
      <strong id="modal-title">Video</strong>
      <button type="button" class="btn" id="modal-close">Close</button>
    </div>
    <video id="player" controls playsinline></video>
  </div>
</div>

<script>
(function () {
  const statusEl = document.getElementById("status");
  const modal = document.getElementById("modal");
  const player = document.getElementById("player");
  const modalTitle = document.getElementById("modal-title");

  function setStatus(t, ok) {
    statusEl.textContent = t;
    statusEl.className = "status" + (ok ? " ok" : "");
  }

  function escapeHtml(s) {
    return String(s)
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;");
  }

  function renderSide(side, files) {
    const box = document.getElementById(side);
    box.innerHTML = "";
    if (!files || !files.length) {
      box.innerHTML = '<div class="empty">No events yet</div>';
      return;
    }
    files.forEach(function (f) {
      const card = document.createElement("div");
      card.className = "card";
      card.title = "Play " + f.name;
      const when = f.mtime ? new Date(f.mtime * 1000).toLocaleString() : "";
      const pct = (f.change_percent != null) ? (" · " + f.change_percent + "%") : "";
      let media = "";
      if (f.thumb) {
        media = '<img src="' + escapeHtml(f.thumb) + '" alt="' + escapeHtml(f.name) + '" loading="lazy">';
      } else {
        media = '<div class="ph">No photo</div>';
      }
      card.innerHTML =
        media +
        '<div class="meta"><strong>' + escapeHtml(f.name) + '</strong>' +
        escapeHtml(when) + escapeHtml(pct) + "</div>";
      card.addEventListener("click", function () {
        modalTitle.textContent = f.name + (f.change_percent != null ? (" · " + f.change_percent + "%") : "");
        player.src = f.url;
        modal.classList.add("open");
        player.play().catch(function () {});
      });
      box.appendChild(card);
    });
  }

  async function load() {
    setStatus("Loading…");
    try {
      const r = await fetch("/api/local-cams/recordings", { credentials: "same-origin" });
      if (r.status === 401) {
        location.href = "/login";
        return;
      }
      if (!r.ok) {
        setStatus("Error " + r.status);
        return;
      }
      const data = await r.json();
      renderSide("left", data.left || []);
      renderSide("right", data.right || []);
      const n = (data.left || []).length + (data.right || []).length;
      setStatus(n + " event(s)", true);
    } catch (e) {
      setStatus(String(e));
    }
  }

  document.getElementById("btn-refresh").addEventListener("click", load);
  document.getElementById("modal-close").addEventListener("click", function () {
    player.pause();
    player.removeAttribute("src");
    modal.classList.remove("open");
  });
  modal.addEventListener("click", function (e) {
    if (e.target === modal) {
      document.getElementById("modal-close").click();
    }
  });

  load();
  setInterval(load, 30000);
})();
</script>
</body>
</html>
