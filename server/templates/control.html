<!DOCTYPE html>
<html lang="en">

<head>
    <link rel="icon" type="image/png" href="/static/PIT.png">
    <link rel="shortcut icon" type="image/png" href="/static/PIT.png">
    <link rel="apple-touch-icon" href="/static/PIT.png">

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Control — Remote Desktop</title>
    <style>
        * { box-sizing: border-box; }
        html, body {
            margin: 0; padding: 0; height: 100%; overflow: hidden;
            background: #020617; color: #e5e7eb;
            font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;
        }
        .app { display: flex; flex-direction: column; height: 100vh; width: 100vw; }
        .toolbar {
            display: flex; align-items: center; justify-content: space-between; gap: 12px;
            padding: 10px 14px; background: rgba(15, 23, 42, 0.96);
            border-bottom: 1px solid rgba(148, 163, 184, 0.15); flex-shrink: 0; z-index: 10;
        }
        .toolbar-left, .toolbar-right { display: flex; align-items: center; gap: 10px; min-width: 0; }
        .title { font-size: 15px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .subtitle { font-size: 12px; color: #94a3b8; white-space: nowrap; }
        .status {
            display: inline-flex; align-items: center; gap: 6px; padding: 5px 10px;
            border-radius: 999px; font-size: 12px; font-weight: 600;
            background: rgba(245, 158, 11, 0.12); color: #fcd34d;
        }
        .status.online { background: rgba(34, 197, 94, 0.12); color: #86efac; }
        .status.offline { background: rgba(239, 68, 68, 0.12); color: #fca5a5; }
        .status .dot { width: 7px; height: 7px; border-radius: 50%; background: currentColor; }
        .btn {
            border: 1px solid rgba(148, 163, 184, 0.2); background: rgba(148, 163, 184, 0.1);
            color: #e5e7eb; border-radius: 10px; padding: 8px 12px; font-size: 13px;
            cursor: pointer; font-family: inherit; white-space: nowrap; text-decoration: none;
        }
        .btn:hover { background: rgba(148, 163, 184, 0.18); }
        .btn.primary { background: rgba(59, 130, 246, 0.22); border-color: rgba(59, 130, 246, 0.4); color: #bfdbfe; }
        .btn.danger { background: rgba(239, 68, 68, 0.15); border-color: rgba(239, 68, 68, 0.35); color: #fecaca; }
        .btn:disabled { opacity: 0.45; cursor: not-allowed; }
        .hint { font-size: 11px; color: #64748b; display: none; }
        @media (min-width: 900px) { .hint { display: inline; } }
        .stage {
            flex: 1; min-height: 0; display: flex; align-items: center; justify-content: center;
            background: #000; position: relative; overflow: hidden; cursor: default;
        }
        .stage.controlling { cursor: none; }
        #local-cursor {
            position: fixed;
            width: 18px;
            height: 22px;
            pointer-events: none;
            z-index: 40;
            display: none;
            transform: translate(0, 0);
            filter: drop-shadow(1px 1px 1px rgba(0,0,0,0.7));
        }
        #local-cursor svg { display: block; width: 18px; height: 22px; }
        #screen {
            max-width: 100%; max-height: 100%; width: auto; height: auto;
            object-fit: contain; display: none; user-select: none; -webkit-user-drag: none; background: #000;
        }
        .placeholder { color: #64748b; text-align: center; padding: 24px; font-size: 14px; line-height: 1.5; }
        .toast {
            position: fixed; right: 16px; bottom: 16px; z-index: 50; min-width: 180px; max-width: 340px;
            padding: 10px 12px; border-radius: 10px; background: rgba(15, 23, 42, 0.95);
            border: 1px solid rgba(148, 163, 184, 0.25); font-size: 13px; opacity: 0;
            transform: translateY(8px); transition: 0.18s ease; pointer-events: none;
        }
        .toast.show { opacity: 1; transform: translateY(0); }
        .toast.ok { border-color: rgba(34, 197, 94, 0.4); color: #bbf7d0; }
        .toast.error { border-color: rgba(239, 68, 68, 0.4); color: #fecaca; }
    </style>
</head>

<body>
    <div class="app">
        <div class="toolbar">
            <div class="toolbar-left">
                <div>
                    <div class="title" id="host-title">Control</div>
                    <div class="subtitle" id="host-sub">Connecting...</div>
                </div>
                <div class="status" id="conn-status">
                    <span class="dot"></span>
                    <span id="conn-text">Idle</span>
                </div>
            </div>
            <div class="toolbar-right">
                <label class="hint" for="quality-select" style="display:inline-flex;align-items:center;gap:6px;">
                    Quality
                    <select id="quality-select" class="btn" style="padding:6px 8px;height:auto;">
                        <option value="low">Low 360p</option>
                        <option value="medium">Medium 540p</option>
                        <option value="high" selected>High 720p</option>
                        <option value="ultra">Ultra 1080p</option>
                    </select>
                </label>
                <span class="hint">Click screen to control · Esc releases</span>
                <button class="btn primary" id="btn-start" type="button">▶ Start</button>
                <button class="btn danger" id="btn-stop" type="button" disabled>■ Stop</button>
                <a class="btn" href="/" id="btn-back">← Back</a>
            </div>
        </div>
        <div class="stage" id="stage">
            <div class="placeholder" id="placeholder">
                Press <b>Start</b> for WebRTC remote desktop (like TeamViewer).<br>
                Then click the screen to control mouse and keyboard.
            </div>
            <video id="screen" autoplay playsinline muted></video>
        </div>
    </div>
    <div id="local-cursor" aria-hidden="true">
        <svg viewBox="0 0 18 22" xmlns="http://www.w3.org/2000/svg">
            <path d="M1 1 L1 18 L5.5 14 L9 21 L12 19.5 L8 12.5 L14 12 Z"
                  fill="#ffffff" stroke="#000000" stroke-width="1.2"
                  stroke-linejoin="round"/>
        </svg>
    </div>
    <div class="toast" id="toast"></div>
    <script src="/static/js/control.js?v=04"></script>
</body>
</html>
