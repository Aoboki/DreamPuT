<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Maps — Family locations</title>
  <link rel="icon" type="image/png" href="/static/PIT.png">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="">
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;
      background: #0f172a;
      color: #e5e7eb;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }
    .top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
      padding: 14px 18px;
      border-bottom: 1px solid #1e293b;
      background: rgba(15, 23, 42, 0.95);
    }
    h1 { margin: 0; font-size: 22px; }
    .sub { color: #94a3b8; font-size: 13px; margin-top: 4px; }
    .actions { display: flex; gap: 8px; flex-wrap: wrap; }
    a.btn, button.btn {
      border: 1px solid #334155;
      background: #111827;
      color: #cbd5e1;
      padding: 9px 14px;
      border-radius: 10px;
      text-decoration: none;
      cursor: pointer;
      font-size: 14px;
    }
    a.btn:hover, button.btn:hover { color: #fff; border-color: #475569; }
    a.btn.primary { background: #2563eb; border-color: #3b82f6; color: #fff; }
    #map { flex: 1; min-height: 70vh; width: 100%; }
    .side {
      padding: 12px 18px 18px;
      border-top: 1px solid #1e293b;
      background: #0b1220;
      max-height: 28vh;
      overflow: auto;
    }
    .device {
      display: flex;
      justify-content: space-between;
      gap: 10px;
      padding: 10px 0;
      border-bottom: 1px solid #1e293b;
      font-size: 14px;
    }
    .device:last-child { border-bottom: 0; }
    .muted { color: #94a3b8; font-size: 12px; }
    .online { color: #4ade80; font-weight: 700; }
    .offline { color: #f87171; font-weight: 700; }
    code { color: #38bdf8; font-size: 12px; }
  </style>
</head>
<body>
  <div class="top">
    <div>
      <h1>🗺️ Family map</h1>
      <div class="sub">Phone markers · refresh every 15s · only devices that report location</div>
    </div>
    <div class="actions">
      <a class="btn" href="/">← Dashboard</a>
      <button class="btn primary" type="button" id="btn-refresh">Refresh</button>
    </div>
  </div>
  <div id="map"></div>
  <div class="side">
    <div class="muted" id="meta">Loading devices…</div>
    <div id="list"></div>
  </div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
  <script>
  (function () {
    const map = L.map("map").setView([48.5, 31.5], 6);
    L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
      maxZoom: 19,
      attribution: "&copy; OpenStreetMap",
    }).addTo(map);

    const markers = {};
    const listEl = document.getElementById("list");
    const metaEl = document.getElementById("meta");

    function ageLabel(sec) {
      if (sec == null) return "—";
      if (sec < 60) return sec + "s ago";
      if (sec < 3600) return Math.floor(sec / 60) + "m ago";
      return Math.floor(sec / 3600) + "h ago";
    }

    async function load() {
      try {
        const r = await fetch("/api/maps/locations?t=" + Date.now(), {
          credentials: "same-origin",
          cache: "no-store",
        });
        if (r.status === 401) {
          location.href = "/login";
          return;
        }
        const data = await r.json();
        const devices = data.devices || [];
        metaEl.textContent = devices.length + " device(s) · updated " + new Date().toLocaleString();
        listEl.innerHTML = "";

        const bounds = [];
        devices.forEach(function (d) {
          const id = d.device_id || d.name || "unknown";
          const lat = Number(d.lat);
          const lon = Number(d.lon);
          const online = !!d.online;
          const name = d.name || id;

          const row = document.createElement("div");
          row.className = "device";
          row.innerHTML =
            "<div><strong>" + name + "</strong><div class='muted'><code>" + id + "</code>" +
            (d.accuracy != null ? " · ±" + Math.round(d.accuracy) + "m" : "") +
            "</div></div>" +
            "<div style='text-align:right'><span class='" + (online ? "online" : "offline") + "'>" +
            (online ? "Online" : "Offline") + "</span><div class='muted'>" + ageLabel(d.age_sec) + "</div></div>";
          listEl.appendChild(row);

          if (!isFinite(lat) || !isFinite(lon)) return;
          bounds.push([lat, lon]);
          const label = name + (online ? " (online)" : " (offline)");
          if (markers[id]) {
            markers[id].setLatLng([lat, lon]);
            markers[id].setPopupContent(label + "<br>" + ageLabel(d.age_sec));
          } else {
            markers[id] = L.marker([lat, lon]).addTo(map).bindPopup(label);
          }
        });

        // remove stale markers
        Object.keys(markers).forEach(function (id) {
          if (!devices.some(function (d) { return (d.device_id || d.name) === id; })) {
            map.removeLayer(markers[id]);
            delete markers[id];
          }
        });

        if (bounds.length === 1) map.setView(bounds[0], 14);
        else if (bounds.length > 1) map.fitBounds(bounds, { padding: [40, 40] });
      } catch (e) {
        metaEl.textContent = "Failed to load: " + e;
      }
    }

    document.getElementById("btn-refresh").addEventListener("click", load);
    load();
    setInterval(load, 15000);
  })();
  </script>
</body>
</html>
